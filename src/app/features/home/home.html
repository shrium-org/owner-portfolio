<div
  class="
    desktop

    relative

    h-dvh
    w-dvw

    overflow-hidden
  "
>

  <!-- Wallpaper -->
  <div
    class="
      fixed
      inset-0
      -z-20
      overflow-hidden
    "
  >
    <img
      [src]="appearance.wallpaper()"
      alt="Wallpaper"
      class="
        h-full
        w-full
        object-cover
        select-none
        pointer-events-none
      "
    />

    <!-- macOS dark overlay -->
    <div
      class="
        absolute
        inset-0
        bg-black/15
      "
    ></div>
  </div>

  <app-navbar
    class="
      absolute
      top-3
      left-0
      w-full
      z-50
    "
  ></app-navbar>

  <main>
    <app-finder-window></app-finder-window>
    <app-contact-window></app-contact-window>
    <app-terminal-window></app-terminal-window>
    <app-safari-window></app-safari-window>
    <app-resume-window></app-resume-window>
    <app-settings-window></app-settings-window>
    <app-photos-window></app-photos-window>
    <app-notepad-window></app-notepad-window>
  </main>


  <app-dock

  ></app-dock>

</div>
